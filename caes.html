<!doctype html>

  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Os Nossos Cães — Golden Ribatejo</title>
    <meta

      content="Conheça os Golden Retrievers reprodutores da Golden Ribatejo. Pais com saúde testada e genealogia certificada."

    <link rel="preconnect" href="https://fonts.googleapis.com" />

              text-align: center;
              color: var(--ink);
              font-size: 16px;
